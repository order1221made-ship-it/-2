<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
  background:#111;
  color:white;
  font-family:sans-serif;
  padding:20px;
}

.card{
  background:#222;
  padding:16px;
  margin-bottom:16px;
  border-radius:16px;
}

.item{
  margin:8px 0;
}

</style>

</head>

<body>

<h1>離乳食ストック</h1>

<div id="app">読み込み中...</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxtyuwiwH3g_tLsHuDh0qJ0dS598skYEYgNCJ8d4O1JDVwh7JnVWAj2UCzb7e3ohyP54Q/exec";

fetch(API_URL)

.then(res => res.json())

.then(data => {

  const grouped = {};

  data.forEach(item => {

    if(!grouped[item.tray]){

      grouped[item.tray] = {
        category:item.category,
        items:[]
      };

    }

    grouped[item.tray].items.push(item);

  });

  let html = "";

  Object.keys(grouped).forEach(tray => {

    html += 
      <div class="card">

        <h2>${tray} ${grouped[tray].category}</h2>
    ;

    grouped[tray].items.forEach(item => {

      html += 
        <div class="item">

          ${item.item} : ${item.count}

        </div>
      ;

    });

    html += </div>;

  });

  document.getElementById("app").innerHTML = html;

})

.catch(err => {

  document.getElementById("app").innerHTML =
    "エラー：" + err;

});

</script>

</body>

</html>
