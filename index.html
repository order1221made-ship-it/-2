<!DOCTYPE html>
<html>
<body style="background:#111;color:white;font-size:30px;">

<div id="app">テスト中...</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxtyuwiwH3g_tLsHuDh0qJ0dS598skYEYgNCJ8d4O1JDVwh7JnVWAj2UCzb7e3ohyP54Q/exec";

fetch(API_URL)
.then(res => res.json())
.then(data => {

  document.getElementById("app").innerHTML =
    JSON.stringify(data);

})
.catch(err => {

  document.getElementById("app").innerHTML =
    "エラー: " + err;

});

</script>

</body>
</html>
