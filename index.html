<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      font-family:sans-serif;
      padding:20px;
      background:#111;
      color:white;
    }

    .card{
      background:#222;
      padding:16px;
      border-radius:16px;
      margin-bottom:16px;
    }

    .row{
      display:flex;
      justify-content:space-between;
      margin:10px 0;
    }

    button{
      width:40px;
      height:40px;
      font-size:20px;
    }
  </style>
</head>

<body>

<h1>離乳食ストック</h1>

<div id="app">読み込み中...</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxTmsA7lt6lAaR75B8Vut9I2nif4CvvgZGZnKQS1suYIjwlwGvy4y0vxfYPGExXp7J9/exec";

async function loadData() {

  const response = await fetch(API_URL);
  const data = await response.json();

  const grouped = {};

  data.forEach(item => {

    if (!grouped[item.tray]) {
      grouped[item.tray] = {
        category: item.category,
        items: []
      };
    }

    grouped[item.tray].items.push(item);

  });

  const app = document.getElementById("app");

  app.innerHTML = "";

  Object.keys(grouped).forEach(tray => {

    const card = document.createElement("div");

    card.className = "card";

    card.innerHTML += 
      <h2>${tray} ${grouped[tray].category}</h2>
    ;

    grouped[tray].items.forEach(item => {

      card.innerHTML += 
        <div class="row">

          <span>${item.item}</span>

          <div>

            <button onclick="updateCount('${item.tray}','${item.item}',-1)">-</button>

            ${item.count}

            <button onclick="updateCount('${item.tray}','${item.item}',1)">+</button>

          </div>

        </div>
      ;
    });

    app.appendChild(card);

  });

}

async function updateCount(tray,item,diff){

  await fetch(API_URL, {
    method:"POST",

    body:JSON.stringify({
      tray:tray,
      item:item,
      diff:diff
    })

  });

  loadData();

}

loadData();

</script>

</body>
</html>
